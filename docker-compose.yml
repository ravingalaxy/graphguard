version: '3.8'

services:
  # Official FalkorDB Graph Database Service
  falkordb:
    image: falkordb/falkordb:latest
    container_name: graphguard-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkor_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # GraphGuard Multi-Agent Investigation Application
  graphguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphguard-app
    ports:
      - "8000:8000"
    environment:
      - FALKOR_HOST=falkordb
      - FALKOR_PORT=6379
      - PORT=8000
      - HOST=0.0.0.0
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkor_data:
    driver: local
